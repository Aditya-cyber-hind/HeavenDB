<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeavenDB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="login-logo">🗄️</div>
        <h1>HeavenDB</h1>
        <p class="subtitle">SQL Database Engine</p>
        
        <div class="form-group">
            <label for="loginUser">Username</label>
            <input type="text" id="loginUser" value="admin" autocomplete="username" spellcheck="false">
        </div>
        
        <div class="form-group">
            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" autocomplete="current-password"
                   onkeypress="if(event.key==='Enter') doLogin()">
        </div>
        
        <button id="loginBtn" class="btn-primary" onclick="doLogin()">Log In</button>
        <div id="loginError" class="error-msg"></div>
    </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="appScreen" class="app-screen" style="display:none;">
    <header class="topbar">
        <div class="brand">
            <span class="logo">🗄️</span>
            <span class="name">HeavenDB</span>
        </div>
        <div class="user-info">
            <span class="dot"></span>
            <span id="whoami">—</span>
            <button class="btn-ghost" onclick="doLogout()">Log Out</button>
        </div>
    </header>
    
    <div class="workspace">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Tables</h3>
                <button class="icon-btn" onclick="loadTables()" title="Refresh">↻</button>
            </div>
            <ul id="tableList" class="table-list">
                <li class="placeholder">Loading…</li>
            </ul>
        </aside>
        
        <main class="main">
            <div class="query-bar">
                <input type="text" id="queryInput"
                       placeholder="Type SQL and press Enter…"
                       onkeypress="if(event.key==='Enter') runQuery()"
                       spellcheck="false" autocomplete="off">
                <button class="btn-primary" onclick="runQuery()" id="runBtn">Run</button>
            </div>
            
            <div id="statusBar" class="status-bar"></div>
            
            <div id="resultArea" class="result-area">
                <div class="empty-state">
                    <div class="empty-icon">⚡</div>
                    <div>Run a query to see results</div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
