<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeavenDB Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗄️ HeavenDB Dashboard</h1>
            <p>Real-time database monitor</p>
        </div>

        <div id="loginBox" class="connection">
            <input type="text" id="loginUser" placeholder="Username" value="admin">
            <input type="password" id="loginPass" placeholder="Password">
            <button onclick="doLogin()">Log In</button>
            <span id="loginStatus"></span>
        </div>

        <div id="mainBox" style="display:none;">
            <div class="connection">
                <span id="whoami">Not logged in</span>
                <button onclick="doLogout()">Log Out</button>
            </div>

            <div class="query-box">
                <input type="text" id="query" placeholder="Type SQL query..." onkeypress="handleEnter(event)">
                <button onclick="executeQuery()">Run</button>
            </div>

            <div class="content">
                <div class="sidebar">
                    <h3>Tables</h3>
                    <ul id="tableList">
                        <li>Run SHOW TABLES to list</li>
                    </ul>
                </div>
                <div class="results">
                    <h3>Results</h3>
                    <pre id="output">Run a query to see results here...</pre>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
