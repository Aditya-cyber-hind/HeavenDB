<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeavenDB Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗄️ HeavenDB Dashboard</h1>
            <p>Real-time database monitor</p>
        </div>

        <div class="connection">
            <input type="text" id="host" value="localhost" placeholder="Host">
            <input type="number" id="port" value="6379" placeholder="Port">
            <button id="connectBtn" onclick="connect()">Connect</button>
            <span id="status" class="status-offline">Disconnected</span>
        </div>

        <div class="query-box">
            <input type="text" id="query" placeholder="Type SQL query..." onkeypress="handleEnter(event)">
            <button onclick="executeQuery()">Run</button>
        </div>

        <div class="content">
            <div class="sidebar">
                <h3>Tables</h3>
                <ul id="tableList">
                    <li>Loading...</li>
                </ul>
            </div>
            <div class="results">
                <h3>Results</h3>
                <pre id="output">Run a query to see results here...</pre>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
